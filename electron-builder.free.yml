# Free distribution: no Apple Developer account, no Windows certificate
# (docs/installation.md#free-and-signed-builds). Used by the release workflow
# when a platform's signing secrets aren't set, and by `npm run dist:local`.
#
# macOS: ad-hoc signed and not notarized. Keys still live in the Secure
# Enclave, via CryptoKit blobs rather than the keychain (SecureEnclaveBlob.swift).
# Windows: unsigned. Windows Hello and TPM keys don't depend on code signing.
extends: ./electron-builder.yml

mac:
  identity: "-"
  hardenedRuntime: false
  notarize: false
  provisioningProfile: null
  # keychain-access-groups etc. are restricted entitlements: without the
  # matching provisioning profile, macOS kills the app at launch (SIGKILL).
  entitlements: build/entitlements.mac.inherit.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist

win:
  # No publisher to verify updates against; electron-updater then checks
  # the SHA-512 from latest.yml (over HTTPS) instead of a signature.
  signtoolOptions:
    publisherName: null
